name: Image

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
    inputs:
      publish:
        description: Push the image to ghcr.io
        type: boolean
        default: false
      latest:
        description: Also tag the published image as latest
        type: boolean
        default: true
      protocol_ref:
        description: TodeX_protocol branch or tag for the pairing test
        type: string
        default: main

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/todex_container

jobs:
  lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - name: shellcheck
        run: shellcheck bin/todexc rootfs/usr/local/bin/todex-entrypoint tests/smoke.sh tests/pairing-e2e/run.sh
      - uses: hadolint/hadolint-action@v3.5.0
        with:
          dockerfile: Dockerfile

  build:
    needs: lint
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/checkout@v7
        with:
          repository: youtonghy/TodeX_protocol
          ref: ${{ inputs.protocol_ref || 'main' }}
          path: TodeX_protocol
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - uses: docker/setup-buildx-action@v4
      - name: Build version
        id: version
        run: |
          agentd=$(sed -n 's/^ARG TODEX_AGENTD_VERSION=//p' Dockerfile | head -n 1)
          echo "agentd=$agentd" >> "$GITHUB_OUTPUT"
          echo "build=$agentd-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Build for testing
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: TODEX_BUILD_VERSION=${{ steps.version.outputs.build }}
          load: true
          tags: todex_container:test
          cache-from: type=gha,scope=${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=${{ matrix.platform }}
      - name: Smoke test
        run: tests/smoke.sh todex_container:test
      - name: Pairing test
        env:
          TODEX_PROTOCOL_DIR: ${{ github.workspace }}/TodeX_protocol
        run: tests/pairing-e2e/run.sh todex_container:test
      - name: Log in to ghcr.io
        if: inputs.publish
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        if: inputs.publish
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: TODEX_BUILD_VERSION=${{ steps.version.outputs.build }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
      - name: Record digest
        if: inputs.publish
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - if: inputs.publish
        uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          retention-days: 1
    outputs:
      agentd: ${{ steps.version.outputs.agentd }}
      build: ${{ steps.version.outputs.build }}

  publish:
    if: inputs.publish
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        working-directory: digests
        env:
          AGENTD: ${{ needs.build.outputs.agentd }}
          BUILD: ${{ needs.build.outputs.build }}
          LATEST: ${{ inputs.latest }}
        run: |
          tags=(-t "$IMAGE:$AGENTD" -t "$IMAGE:$BUILD")
          if [ "$LATEST" = true ]; then tags+=(-t "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$BUILD"
