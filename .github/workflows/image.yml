name: Publish image

on:
  workflow_dispatch:
    inputs:
      latest:
        description: Also tag the published image as latest
        type: boolean
        default: true
      protocol_ref:
        description: TodeX_protocol branch or tag for the pairing test
        type: string
        default: main

permissions:
  contents: read

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/todex_container

jobs:
  checks:
    uses: ./.github/workflows/checks.yml
    with:
      protocol_ref: ${{ inputs.protocol_ref }}

  build:
    needs: checks
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-24.04
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - name: Build version
        id: version
        run: |
          agentd=$(sed -n 's/^ARG TODEX_AGENTD_VERSION=//p' Dockerfile | head -n 1)
          echo "agentd=$agentd" >> "$GITHUB_OUTPUT"
          echo "build=$agentd-$(date -u +%Y%m%d)" >> "$GITHUB_OUTPUT"
      - name: Log in to ghcr.io
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Push by digest
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: ${{ matrix.platform }}
          build-args: TODEX_BUILD_VERSION=${{ steps.version.outputs.build }}
          labels: org.opencontainers.image.source=${{ github.server_url }}/${{ github.repository }}
          outputs: type=image,name=${{ env.IMAGE }},push-by-digest=true,name-canonical=true,push=true
          cache-from: type=gha,scope=${{ matrix.platform }}
      - name: Record digest
        run: |
          mkdir -p digests
          touch "digests/${DIGEST#sha256:}"
        env:
          DIGEST: ${{ steps.push.outputs.digest }}
      - uses: actions/upload-artifact@v7
        with:
          name: digest-${{ matrix.runner }}
          path: digests/*
          retention-days: 1
    outputs:
      agentd: ${{ steps.version.outputs.agentd }}
      build: ${{ steps.version.outputs.build }}

  publish:
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          pattern: digest-*
          merge-multiple: true
          path: digests
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Create multi-arch tags
        working-directory: digests
        env:
          AGENTD: ${{ needs.build.outputs.agentd }}
          BUILD: ${{ needs.build.outputs.build }}
          LATEST: ${{ inputs.latest }}
        run: |
          tags=(-t "$IMAGE:$AGENTD" -t "$IMAGE:$BUILD")
          if [ "$LATEST" = true ]; then tags+=(-t "$IMAGE:latest"); fi
          sources=()
          for digest in *; do sources+=("$IMAGE@sha256:$digest"); done
          docker buildx imagetools create "${tags[@]}" "${sources[@]}"
          docker buildx imagetools inspect "$IMAGE:$BUILD"
